name: Deploy to Railway

on:
  push:
    branches:
      - produccion

jobs:
  deploy:
    if: github.repository == 'deivisaherreraj/website'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # (Opcional) Correr tests de Python/Reflex antes de desplegar
      # - name: Run tests
      #   run: |
      #     cd website_frontend
      #     pip install -r requirements.txt
      #     pytest

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        with:
          # Cambia esto por el nombre real del servicio en Railway
          service: "link-bio-website"
          # o por ejemplo "dherrerajdev" / "link-bio" según cómo lo tengas
