[project]
name = "website-frontend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "configcat-client>=10.0.0",
    "fastapi>=0.135.3",
    "python-dotenv>=1.2.2",
    "pytz>=2026.1.post1",
    "reflex>=0.8.28.post1",
    "requests>=2.33.1",
    "supabase>=2.28.3",
]

[dependency-groups]
dev = [
    "mypy>=1.18.1",
    "pytest>=8.4.1",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = [
    "website_frontend",
    "tests",
]
exclude = [
    "website_frontend/components/",
    "website_frontend/pages/",
    "website_frontend/views/",
    "website_frontend/styles/",
    "website_frontend/website_frontend.py",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "tests.components.*",
    "website_frontend.components.*",
    "tests.integrations.*",
]
ignore_errors = true
